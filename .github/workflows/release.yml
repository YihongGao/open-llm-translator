name: Release

# Push a tag like v0.2.0 after bumping the version in both package.json and
# public/manifest.json. Builds the store zip, attests its provenance and
# attaches it to a GitHub Release. Uploading to the Chrome Web Store stays manual.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Tag matches package.json and manifest.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg=$(node -p 'require("./package.json").version')
          man=$(node -p 'require("./public/manifest.json").version')
          if [ "$TAG" != "v$pkg" ] || [ "$TAG" != "v$man" ]; then
            echo "::error::tag $TAG, package.json $pkg, manifest.json $man must all match"
            exit 1
          fi
      - run: npm ci
      - run: npm run package
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/*.zip --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
