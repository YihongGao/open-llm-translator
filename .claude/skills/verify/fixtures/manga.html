<!doctype html>
<!-- Verification fixture for image translation. #page is a synthetic comic page (900x1280, speech bubbles drawn on white),
     shown 600 px tall at the top-left so it fits the 1280x900 viewport; the tall spacer lets a script scroll it half out of view. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Verify fixture: manga page</title>
    <style>
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; }
      #page { display: block; height: 600px; margin-left: 100px; }
      #spacer { height: 1600px; }
    </style>
  </head>
  <body>
    <img id="page" src="manga.png" alt="" />
    <div id="spacer"></div>
  </body>
</html>
