<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Open LLM Translator</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #59636e;
        --border: #d1d9e0;
        --field: #f6f8fa;
        --accent: #0969da;
        --accent-hover: #0757b8;
        --accent-fg: #ffffff;
        --warn-bg: #fff8c5;
        --warn-fg: #6c4a00;
        --warn-border: #e7c74b;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f2329;
          --fg: #f0f6fc;
          --muted: #9198a1;
          --border: #3d444d;
          --field: #262c36;
          --accent: #4493f8;
          --accent-hover: #2f81f7;
          --accent-fg: #ffffff;
          --warn-bg: #3b2e00;
          --warn-fg: #f2cc60;
          --warn-border: #6c5300;
        }
      }
      * {
        box-sizing: border-box;
      }
      /* The CJK fallback of system-ui follows the browser's locale, not <html lang>, so each
         UI language names its own fonts (keep in sync with options.html and toast.ts). */
      :root {
        --ui-font: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      }
      :root:lang(en) { --ui-font: system-ui, -apple-system, sans-serif; }
      :root:lang(ja) { --ui-font: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", Meiryo, "Noto Sans JP", sans-serif; }
      :root:lang(zh-CN) { --ui-font: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.5 var(--ui-font);
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px;
      }
      .warn {
        display: none;
        margin-bottom: 12px;
        padding: 8px 10px;
        border: 1px solid var(--warn-border);
        border-radius: 8px;
        background: var(--warn-bg);
        color: var(--warn-fg);
      }
      .warn.show {
        display: block;
      }
      .warn button {
        all: unset;
        cursor: pointer;
        text-decoration: underline;
        font-weight: 600;
        margin-left: 4px;
      }
      label {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin: 10px 0 4px;
      }
      select {
        width: 100%;
        padding: 7px 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--field);
        color: var(--fg);
        font: inherit;
      }
      #toggle {
        width: 100%;
        margin-top: 16px;
        padding: 10px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-fg);
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      #toggle:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      #toggle:disabled,
      #subs:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #subs {
        display: none;
        width: 100%;
        margin-top: 8px;
        padding: 9px;
        border: 1px solid var(--accent);
        border-radius: 8px;
        background: transparent;
        color: var(--accent);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      #subs.show {
        display: block;
      }
      #subs:hover:not(:disabled) {
        background: var(--field);
      }
      #toggle:focus-visible,
      #subs:focus-visible,
      select:focus-visible,
      .link:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #note {
        min-height: 1.5em;
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
      }
      .link {
        all: unset;
        cursor: pointer;
        color: var(--fg);
      }
      .link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>Open LLM Translator</h1>

    <div class="warn" id="warn" role="alert">
      <span id="warnText" data-i18n="popupWarnNoKey">No API key set.</span><button type="button" id="warnSettings" data-i18n="openSettings">Open settings</button>
    </div>

    <label for="targetLang" data-i18n="popupTranslateTo">Translate to</label>
    <select id="targetLang"></select>

    <label for="model" data-i18n="labelModel">Model</label>
    <select id="model"></select>

    <button type="button" id="toggle" data-i18n="popupTranslatePage">Translate this page</button>
    <button type="button" id="subs" data-i18n="popupSubsOn">Turn on bilingual subtitles</button>
    <p id="note" role="status"></p>

    <footer>
      <button type="button" class="link" id="settings" data-i18n="popupSettings">⚙ Settings</button>
      <button type="button" class="link" id="shortcuts" data-i18n="popupShortcuts">Shortcuts</button>
      <span id="version"></span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
