<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>LLM Translator 設定</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "PingFang TC", sans-serif;
      }
      body {
        max-width: 560px;
        margin: 40px auto;
        padding: 0 16px;
        line-height: 1.5;
      }
      label {
        display: block;
        font-weight: 600;
        margin-top: 20px;
      }
      .hint {
        font-size: 0.85em;
        opacity: 0.7;
        margin: 4px 0 0;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        margin-top: 6px;
        font: inherit;
      }
      .actions {
        margin-top: 24px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      button {
        padding: 8px 16px;
        font: inherit;
        cursor: pointer;
      }
      #status {
        font-size: 0.9em;
      }
      .ok {
        color: #2e7d32;
      }
      .err {
        color: #c62828;
      }
    </style>
  </head>
  <body>
    <h1>LLM Translator 設定</h1>

    <form id="form">
      <label for="apiKey">Anthropic API key</label>
      <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-..." />
      <p class="hint">只存在這台電腦的 chrome.storage.local，不會經由 Chrome Sync 同步。</p>

      <label for="model">Model</label>
      <select id="model"></select>

      <label for="targetLang">目標語言</label>
      <select id="targetLang"></select>

      <div class="actions">
        <button type="submit">儲存</button>
        <button type="button" id="test">測試連線</button>
        <span id="status" role="status"></span>
      </div>
    </form>

    <p class="hint" style="margin-top: 32px">
      使用方式：在網頁上點擴充功能圖示或按 Alt+A 切換翻譯。快捷鍵可在 chrome://extensions/shortcuts 修改。
    </p>

    <script src="options.js"></script>
  </body>
</html>
