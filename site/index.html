<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open LLM Translator</title>
<link rel="alternate" hreflang="zh-Hant-TW" href="https://yihonggao.github.io/open-llm-translator/zh-tw/">
<link rel="alternate" hreflang="en" href="https://yihonggao.github.io/open-llm-translator/en/">
<link rel="alternate" hreflang="x-default" href="https://yihonggao.github.io/open-llm-translator/">
<link rel="icon" href="icons/icon-32.png">
<style>
  body { margin: 0; padding: 64px 16px; text-align: center; font: 17px/1.6 system-ui, sans-serif; background: #eceee9; color: #16191a; }
  a { color: #1a6342; font-weight: 600; margin: 0 12px; }
  /* Shown only if the redirect below has not happened within a second. */
  body { visibility: hidden; animation: reveal 0s 1s forwards; }
  @keyframes reveal { to { visibility: visible; } }
</style>
<noscript><style>body { visibility: visible; animation: none; }</style></noscript>
<script type="module">
  import { pickSiteLang } from "./lang.js";
  let saved = null;
  try { saved = localStorage.getItem("llmt-site-lang"); } catch {}
  const lang = pickSiteLang(navigator.languages?.length ? navigator.languages : [navigator.language ?? ""], saved);
  location.replace(`${lang}/${location.search}${location.hash}`);
</script>
</head>
<body>
<p><strong>Open LLM Translator</strong></p>
<p><a href="zh-tw/" hreflang="zh-Hant-TW" lang="zh-Hant-TW">繁體中文</a><a href="en/" hreflang="en">English</a></p>
</body>
</html>
